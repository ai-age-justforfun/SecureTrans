# ============================================================
# SecureTrans Nginx 单网卡配置（生产：单网卡 + 防火墙放行内外网）
# 场景：服务器只有一张网卡，防火墙允许内网/外网都访问同一地址（IP:80）
#       Nginx 按来源 IP 网段自动识别内外网，注入 X-Network-Zone
#       （应用层据此隔离：外网面仅登录+下载，管理接口 403）
# 放置：/etc/nginx/conf.d/securetrans-single.conf
# 前置：按实际网络修改下方 geo 块中的内网网段
# 启用：与 nginx-securetrans.conf(双网卡) 二选一，勿同时启用
# ============================================================

# 按客户端来源 IP 网段分配网络面（命中内网网段 → internal，其余 → external）
# 修改为贵单位实际内网网段；外网来源未命中则视为 external（仅下载）
geo $network_zone {
    default        external;
    10.0.0.0/8     internal;
    172.16.0.0/12  internal;
    192.168.0.0/16 internal;
}

server {
    listen 80;                 # 单网卡：防火墙放行内外网都访问此端口
    server_name securetrans.example.com;

    # 大文件上传支持（800MB，与 .env 中 MAX_CONTENT_LENGTH 一致）
    client_max_body_size 800M;
    proxy_request_buffering off;   # 流式上传，不缓冲到磁盘

    # 超时设置（大文件上传）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关键：按来源网段注入网络面，应用层据此做内外网功能隔离
        proxy_set_header X-Network-Zone $network_zone;
    }
}

