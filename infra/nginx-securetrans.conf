# ============================================================
# SecureTrans Nginx 反向代理配置（双网卡模式）
# 适用：服务器两张网卡（内网卡 + 外网卡），分别绑定不同 IP
#       内网面全功能（提交/审批/管理），外网面仅下载（应用层再兜底隔离）
# 单网卡场景：使用 nginx-securetrans-single.conf（按来源网段识别，二选一）
# 放置于 /etc/nginx/conf.d/securetrans.conf 或 sites-available
# ============================================================

# 内网服务（提交、审批、管理）— 监听内网网卡
server {
    # 生产环境绑定内网网卡 IP，如 listen 192.168.1.10:80;
    listen 80;
    server_name securetrans.internal.company.com;

    # 大文件上传支持（800MB）
    client_max_body_size 800M;
    proxy_request_buffering off;  # 流式上传，不缓冲到磁盘

    # 超时设置（大文件上传）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 标记内网管理面（后端据此识别网络面）
        proxy_set_header X-Network-Zone internal;
    }
}

# 外网下载服务（仅开放下载接口）— 监听外网网卡
# 生产环境绑定外网网卡 IP（如 listen 203.0.113.10:443 ssl）
server {
    listen 80;
    server_name securetrans.external.company.com;

    client_max_body_size 800M;
    proxy_read_timeout 300s;

    # 仅允许下载相关路径
    location ~ ^/(api/external/|login|static/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 标记外网下载面（后端据此识别网络面并做应用层隔离）
        proxy_set_header X-Network-Zone external;
    }

    # 拒绝其他所有路径
    location / {
        return 403;
    }
}

