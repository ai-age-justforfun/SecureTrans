# ============================================================
# SecureTrans GitLab CICD（gitlabcicotest 实验线）
# 职责对齐（ADR-037）：CI=完整门禁（静态+TDD+mock）、Release=发布、CD=独立 Docker 部署
# 隔离纪律（用户硬约束）：绝对不碰 Gitea/GitHub 主链路与 Rocky 测试/生产环境；
#   部署目标=gitlabcicotest WSL 内 docker 独立环境（18080 端口 + /opt/securetrans-gitlab 数据）。
# Runner：gitlabcicotest-docker（docker executor，挂载 docker.sock + /opt/securetrans-gitlab）
# 触发：push gitlabcicotest → CI；push tag v* → CI + Release + CD
# ============================================================

stages:
  - ci-check
  - release
  - deploy

# ---------------- CI：静态门禁 + 全量 TDD（每次 push / tag） ----------------
ci-check:
  stage: ci-check
  image: securetrans-gitlab-ci:3.12
  tags: [gitlabcicotest]
  variables:
    GITHUB_WORKSPACE: "$CI_PROJECT_DIR"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "gitlabcicotest"'
  script:
    - set -euo pipefail
    - cd "$CI_PROJECT_DIR"
    # [1/5] 静态检查（ADR-035 preflight 的依赖/版本双源/端口由 ci_test.sh 覆盖；此处语法+静态）
    - |
      python -m py_compile src/app.py tests/test_api.py infra/static_check.py
      python infra/static_check.py src/app.py tests/test_api.py
      echo "[1/5] 静态检查 PASS"
    # [2/5] 版本双源一致性（app.py ↔ index.html）
    - |
      V_BE=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
      V_FE=$(grep -m1 "const APP_VERSION = 'v" src/static/index.html | sed -E "s/.*'v([^']+)'.*/\1/")
      echo "[2/5] 版本双源: backend=$V_BE frontend=$V_FE"
      [ "$V_BE" = "$V_FE" ] || { echo "版本不一致 FAIL"; exit 1; }
    # [3/5] env 键一致性（dev/test 一致，prod 可多不可缺）
    - |
      python - <<'EOF'
      import re
      def keys(p):
          return {m.group(1) for m in re.finditer(r'^\s*([A-Z][A-Z0-9_]*)=', open(p, encoding='utf-8').read(), re.M)}
      dev, test, prod = keys('env/dev.env'), keys('env/test.env'), keys('env/prod.env.template')
      drift, missing = dev ^ test, (dev & test) - prod
      if drift: print("FAIL dev/test 键不一致:", sorted(drift)); exit(1)
      if missing: print("FAIL prod 缺核心键:", sorted(missing)); exit(1)
      print(f"[3/5] env 键一致性 PASS (dev={len(dev)} test={len(test)} prod={len(prod)})")
      EOF
    # [4/5] 关键脚本完整性
    - |
      for f in infra/deploy.sh infra/verify.sh infra/smoke.sh infra/package.sh infra/ci_test.sh; do
        [ -f "$f" ] || { echo "缺少 $f"; exit 1; }
      done
      echo "[4/5] 脚本完整性 PASS"
    # [5/5] 全量 TDD（干净 /data + mock 数据 + 性能门禁；容器内端口 18000）
    - echo "[5/5] 全量 TDD（干净数据 + mock + 性能）"
    - bash infra/ci_test.sh

# ---------------- Release：tag 触发，打包 + GitLab Release + 包资产 ----------------
release:
  stage: release
  image: securetrans-gitlab-ci:3.12
  tags: [gitlabcicotest]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  variables:
    GIT_STRATEGY: clone
  script:
    - set -euo pipefail
    - cd "$CI_PROJECT_DIR"
    # 1. offline-deps（镜像 wheelhouse 自包含）
    - mkdir -p packages && tar -czf packages/securetrans-offline-deps.tar.gz -C / wheelhouse
    # 2. 打包（版本号从 src/app.py 精确提取）
    - bash infra/package.sh
    # 3. 资产校验（md5/sha256）
    - |
      V=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
      PKG="packages/securetrans-${V}.tar.gz"
      md5sum "$PKG" | awk '{print $1}' > "$PKG.md5"
      sha256sum "$PKG" | awk '{print $1}' > "$PKG.sha256"
      echo "V=$V" > /tmp/vars.txt
      ls -la packages/
    # 4. GitLab Release 创建 + 主包上传 Generic Package Registry（可下载资产）
    - |
      set -euo pipefail
      V=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
      API="http://10.10.30.9/api/v4/projects/${CI_PROJECT_ID}"
      AUTH="PRIVATE-TOKEN: ${GITLAB_PAT}"
      DESC="SecureTrans v${V}（GitLab CICD 实验发布 gitlabcicotest）"
      DESC="${DESC} — 本版变更摘要：$(git log -1 --format=%s | sed 's/"/\\"/g')"
      curl -sf -H "$AUTH" -X POST "$API/releases" -H "Content-Type: application/json" \
        -d "{\"name\":\"v${V}\",\"tag_name\":\"${CI_COMMIT_TAG}\",\"description\":\"${DESC}\"}" || true
      # 上传主包到 Generic Package（package_name=securetrans, version=v<V>）
      curl -sf -H "$AUTH" -X POST "$API/packages/generic/securetrans/v${V}/securetrans-${V}.tar.gz" \
        -F "file=@packages/securetrans-${V}.tar.gz" || echo "（包可能已存在，跳过）"
      echo "GitLab Release v${V} 已创建"
  artifacts:
    paths:
      - packages/
    expire_in: 1 week

# ---------------- CD：tag 触发，独立 Docker 部署（gitlabcicotest，绝不碰生产） ----------------
deploy:
  stage: deploy
  image: securetrans-gitlab-ci:3.12
  tags: [gitlabcicotest]
  dependencies:
    - release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - set -euo pipefail
    - cd "$CI_PROJECT_DIR"
    # 1. 构建运行镜像（wheelhouse 来自 artifacts 的 offline-deps，独立 tag）
    - |
      V=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
      docker build -q -f infra/docker/Dockerfile.run -t securetrans-gitlab:v${V} . 2>&1 | tail -3
      echo "运行镜像 securetrans-gitlab:v${V} 构建完成"
    # 2. 独立部署（蓝绿纪律：先停旧再起新；18080 独立端口；/opt/securetrans-gitlab 独立数据）
    - |
      set -euo pipefail
      V=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
      docker rm -f securetrans-gitlab 2>/dev/null || true
      mkdir -p /opt/securetrans-gitlab/data /opt/securetrans-gitlab/nas
      # 卷属主对齐容器内 uid 1000（Dockerfile.run USER securetrans）；root 经卷写宿主
      chown -R 1000:1000 /opt/securetrans-gitlab
      # 生成干净 .env（去注释去空行；prod 模板 + 实验线覆盖）
      sed -e 's/^[[:space:]]*#.*//' -e '/^[[:space:]]*$/d' env/prod.env.template > /tmp/gitlab.env
      printf 'HOST=0.0.0.0\nPORT=8000\nDEPLOY_MODE=production\nENV_ROLE=prod\nSECURETRANS_DATA=/data\nNAS_ROOT=/nas\n' >> /tmp/gitlab.env
      docker run -d --name securetrans-gitlab \
        -p 18080:8000 \
        -v /opt/securetrans-gitlab/data:/data \
        -v /opt/securetrans-gitlab/nas:/nas \
        --env-file /tmp/gitlab.env \
        securetrans-gitlab:v${V}
      sleep 4
      echo "容器已启动"
    # 3. 只读冒烟（容器 IP——job 容器内 localhost 非宿主；容器发布在宿主 18080）
    - |
      set -euo pipefail
      sleep 3
      CIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' securetrans-gitlab)
      echo "容器 IP: ${CIP}"
      H=$(curl -sf --retry 6 --retry-delay 2 http://${CIP}:8000/api/health)
      echo "health: $H"
      echo "$H" | grep -q '"status":"ok"' || { echo "health 非 ok FAIL"; exit 1; }
      echo "$H" | grep -q "v${V}" || { echo "版本不匹配 FAIL"; exit 1; }
      curl -sf -o /dev/null -w "login_page: %{http_code}\n" http://${CIP}:8000/login
      echo "CD 独立部署冒烟 PASS（容器 ${CIP}:8000；宿主 18080 对外）"
