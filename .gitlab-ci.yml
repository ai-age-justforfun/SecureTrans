# ============================================================
# SecureTrans GitLab CICD 入口（对标 .gitea/workflows 与 .github/workflows）
# 明细拆分到 .gitlab/workflows/{ci,release,deploy}.yml，经 include 本地引用
# 职责对齐（ADR-037）：CI=完整门禁（静态+TDD+mock）、Release=发布、CD=独立 Docker 部署
# 隔离纪律（ADR-045/049）：本配置为已隔离归档的 GitLab 实验线资产；
#   主仓库默认不推送 GitLab；再启用须用户明确指示（由公司侧另一 AI 工具维护）
# Runner：gitlabcicotest-docker（docker executor，挂载 docker.sock + /opt/securetrans-gitlab）
# 触发：push gitlabcicotest → CI；push tag v* → CI + Release + CD
# ============================================================

stages:
  - ci-check
  - release
  - deploy

include:
  - local: '.gitlab/workflows/ci.yml'
  - local: '.gitlab/workflows/release.yml'
  - local: '.gitlab/workflows/deploy.yml'
