# ============================================================
# SecureTrans Nginx 反向代理配置
# 放置于 /etc/nginx/conf.d/securetrans.conf 或 sites-available
# ============================================================

# 内网服务（提交、审批、管理）— 监听内网网卡
server {
    listen 80;
    server_name securetrans.internal.company.com;

    # 大文件上传支持（1GB）
    client_max_body_size 1G;
    proxy_request_buffering off;  # 流式上传，不缓冲到磁盘

    # 超时设置（大文件上传）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 外网下载服务（仅开放下载接口）— 监听外网网卡
# 如需物理隔离双网卡，可复制此 server 块绑定到外网 IP
server {
    listen 80;
    server_name securetrans.external.company.com;

    client_max_body_size 1G;
    proxy_read_timeout 300s;

    # 仅允许下载相关路径
    location ~ ^/(api/external/|login|static/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 拒绝其他所有路径
    location / {
        return 403;
    }
}

