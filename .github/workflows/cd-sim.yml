# SecureTrans CD 仿真（GitHub-hosted ubuntu-latest · 云端 Docker · 端口 18000 · 绝不触碰生产）
# 背景：生产 10.10.30.8 在封闭数据中心，GitHub 无法直连（Gitea cd.yml 负责真实生产发布）。
# 本 workflow = GitHub 端到端 CD 仿真验证：release published（或手动 dispatch）时，
# 在 GitHub 云环境 ubuntu-latest 上构建镜像 + 独立容器 + healthz + 版本断言，
# 证明"代码可部署可运行"链路完整。
# 特点（2026-09-15 升级）：
#   - 完全云端：不再依赖本地 self-hosted runner / 本地 Docker（本地仿真容器退役）
#   - 一次性干净环境：job 结束容器即销毁，无持久卷、无数据残留
#   - release 事件断言版本（tag=vX.Y.Z）；手动 dispatch 仅验证可部署可运行
# 约束：端口 18000 与生产 8000 隔离；不写生产任何数据（ADR-021/036：备份仓永不接触生产）。

name: CD-SIM

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.6.7，用于 dispatch 时版本断言；留空仅验证可部署可运行）'
        required: false
        default: ''

jobs:
  deploy-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sim image (online deps)
        run: |
          docker build -f .github/docker/Dockerfile.sim -t securetrans-sim:latest .

      - name: Start sim container (isolated, port 18000)
        run: |
          docker rm -f securetrans-sim 2>/dev/null || true
          docker run -d --name securetrans-sim \
            -p 18000:8000 \
            -e SECURETRANS_DATA=/data -e NAS_ROOT=/data \
            -e HOST=0.0.0.0 -e PORT=8000 \
            -e APP_STAGE=sim -e ENV_ROLE=test -e AD_MOCK_MODE=true \
            -e RESET_PASSWORD=Init@123456 \
            securetrans-sim:latest
          echo "sim container started"

      - name: Health check + version assert (sim)
        run: |
          H=""
          for i in $(seq 1 30); do
            H=$(curl -sf --max-time 3 http://127.0.0.1:18000/api/health 2>/dev/null) && break
            sleep 2
          done
          if [ -z "$H" ]; then
            echo "::error::SIM health check failed after 60s"
            docker logs --tail 30 securetrans-sim
            exit 1
          fi
          echo "SIM HEALTH: $H"
          # 版本断言：release 事件用 release tag；workflow_dispatch 用 inputs.version（若提供）
          VER_EXPECTED=""
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VER_EXPECTED="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER_EXPECTED="${{ github.event.inputs.version }}"
            VER_EXPECTED="${VER_EXPECTED#v}"
          fi
          if [ -n "$VER_EXPECTED" ]; then
            VER_ACTUAL=$(printf '%s' "$H" | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"].lstrip("v"))')
            echo "VERSION ASSERT: expected=$VER_EXPECTED actual=$VER_ACTUAL"
            [ "$VER_EXPECTED" = "$VER_ACTUAL" ] || { echo "::error::版本断言失败"; docker logs --tail 30 securetrans-sim; exit 1; }
            echo "VERSION ASSERT: OK"
          else
            echo "manual dispatch 未带版本：仅验证可部署可运行"
          fi

      - name: Data cleanliness assert (fresh container, no history/test data)
        run: |
          # 目的：证明 CD-SIM 容器 = 全新环境（无 TDD 测试数据、无历史数据），达到生产发布级洁净标准。
          # 说明：云端容器无持久卷（无 -v）、不 COPY tests、无灌数据动作；本地 127.0.0.1:8000 的历史
          # 数据来自旧本地仿真容器 securetrans-sim-data 命名卷（已退役），非本 workflow 行为。
          # ① 文件系统层：staging / external / archive 业务目录必须为空
          BIZ=$(docker exec securetrans-sim sh -c 'find /data/staging /data/external /data/archive -type f 2>/dev/null | wc -l')
          echo "业务文件数: $BIZ"
          [ "$BIZ" = "0" ] || { echo "::error::容器非全新（业务文件=$BIZ，存在历史数据）"; exit 1; }
          echo "文件系统洁净: OK (staging/external/archive 均为空)"
          # ② 应用层：admin 默认重置密码登录 → 提交记录总数必须为 0
          rm -f /tmp/st_cookies.txt
          LOGIN=$(curl -sf -c /tmp/st_cookies.txt -X POST http://127.0.0.1:18000/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"Init@123456"}') \
            || { echo "::error::admin 默认重置密码登录失败（RESET_PASSWORD=Init@123456 应可登录）"; exit 1; }
          echo "ADMIN LOGIN: $LOGIN"
          SUBS=$(curl -sf -b /tmp/st_cookies.txt http://127.0.0.1:18000/api/admin/submissions/all) \
            || { echo "::error::提交记录 API 获取失败"; exit 1; }
          CNT=$(printf '%s' "$SUBS" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          echo "提交记录总数: $CNT"
          [ "$CNT" = "0" ] || { echo "::error::容器存在历史提交（$CNT 条），非全新环境"; exit 1; }
          echo "DATA CLEAN: OK（全新容器，无历史/测试数据，与生产发布级洁净标准一致）"
