# SecureTrans CD 仿真（GitHub-hosted ubuntu-latest · 云端 Docker · 端口 18000 · 绝不触碰生产）
# 背景：生产 10.10.30.8 在封闭数据中心，GitHub 无法直连（Gitea cd.yml 负责真实生产发布）。
# 本 workflow = GitHub 端到端 CD 仿真验证：release published（或手动 dispatch）时，
# 在 GitHub 云环境 ubuntu-latest 上构建镜像 + 独立容器 + healthz + 版本断言，
# 证明"代码可部署可运行"链路完整。
# 特点（2026-09-15 升级）：
#   - 完全云端：不再依赖本地 self-hosted runner / 本地 Docker（本地仿真容器退役）
#   - 一次性干净环境：job 结束容器即销毁，无持久卷、无数据残留
#   - release 事件断言版本（tag=vX.Y.Z）；手动 dispatch 仅验证可部署可运行
# 约束：端口 18000 与生产 8000 隔离；不写生产任何数据（ADR-021/036：备份仓永不接触生产）。

name: CD-SIM

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sim image (online deps)
        run: |
          docker build -f .github/docker/Dockerfile.sim -t securetrans-sim:latest .

      - name: Start sim container (isolated, port 18000)
        run: |
          docker rm -f securetrans-sim 2>/dev/null || true
          docker run -d --name securetrans-sim \
            -p 18000:8000 \
            -e SECURETRANS_DATA=/data -e NAS_ROOT=/data \
            -e HOST=0.0.0.0 -e PORT=8000 \
            -e APP_STAGE=sim -e ENV_ROLE=test -e AD_MOCK_MODE=true \
            -e RESET_PASSWORD=Init@123456 \
            securetrans-sim:latest
          echo "sim container started"

      - name: Health check + version assert (sim)
        run: |
          H=""
          for i in $(seq 1 30); do
            H=$(curl -sf --max-time 3 http://127.0.0.1:18000/api/health 2>/dev/null) && break
            sleep 2
          done
          if [ -z "$H" ]; then
            echo "::error::SIM health check failed after 60s"
            docker logs --tail 30 securetrans-sim
            exit 1
          fi
          echo "SIM HEALTH: $H"
          # release 事件：断言 容器内版本 == release tag（workflow_dispatch 仅验证可运行）
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VER_EXPECTED="${GITHUB_REF_NAME#v}"
            VER_ACTUAL=$(printf '%s' "$H" | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"].lstrip("v"))')
            echo "VERSION ASSERT: expected=$VER_EXPECTED actual=$VER_ACTUAL"
            [ "$VER_EXPECTED" = "$VER_ACTUAL" ] || { echo "::error::版本断言失败"; docker logs --tail 30 securetrans-sim; exit 1; }
            echo "VERSION ASSERT: OK"
          else
            echo "manual dispatch: 仅验证可部署可运行（版本随分支）"
          fi
