# GitHub 独立发布（RELEASE）：push tag 或手动 → 云端构建 4 资产 → 创建/补齐 GitHub Release → GHCR push 镜像 → 触发 CD-SIM
# 用途：让 GitHub 侧 CI/CD/Release 完全独立闭环（与 Gitea 权威仓平行）：
#   push main → CI-TDD（ubuntu 全量）→ 打 tag push GitHub → 本 workflow 云端构建
#   主包+md5+sha256+offline-deps 4 资产 → gh release create → Docker 镜像 push GHCR（RTM 起，ADR-038）
#   → release published 触发 CD-SIM（云端仿真）。
# 特点（2026-09-15 RTM 扩展）：
#   - 完全在 GitHub 云环境构建（ubuntu-latest），不依赖本地环境/本地 Docker
#   - 幂等：release 已存在则补齐/覆盖资产（--clobber），不存在则创建
#   - 资产与 Gitea 对齐：securetrans-<v>.tar.gz + .md5 + .sha256 + securetrans-offline-deps.tar.gz
#     + securetrans-<v>-image.tar.gz + .md5（第 5 资产，离线镜像兜底，ADR-058）
#   - 镜像双通道：GHCR push（在线分发）+ image.tar.gz（零出网环境 podman load 离线兜底）
#   - offline-deps 现场 pip download（linux x86_64 manylinux wheel，与生产部署兼容）
# 约束：备份仓永不接触生产（ADR-021/036）；生产 CD 仍由 Gitea 权威仓负责。

name: RELEASE

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 tag（手动触发用，如 v2.6.6）'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.tag }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "RESOLVED VERSION: $V"

      - name: Build offline-deps (linux x86_64 wheels, online)
        run: |
          # 打包结构必须与 Gitea 侧一致：含 wheelhouse/ 顶层目录（Dockerfile.run 解压到 /tmp/ 后
          # pip --find-links /tmp/wheelhouse 才能命中；若平铺打包则 docker build 报 "from versions: none"）
          mkdir -p /tmp/deps/wheelhouse packages
          pip download --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 312 --implementation cp --abi cp312 \
            -r infra/docker/requirements.txt -d /tmp/deps/wheelhouse
          # 输出到 packages/ 下（与 Gitea package.sh 路径一致；Dockerfile.run COPY packages/securetrans-offline-deps.tar.gz）
          tar -czf packages/securetrans-offline-deps.tar.gz -C /tmp/deps wheelhouse
          ls -lh packages/securetrans-offline-deps.tar.gz
          tar -tzf packages/securetrans-offline-deps.tar.gz | head -3

      - name: Build package tarball (src+tests+infra+docs+env+offline-python)
        run: |
          V="${{ steps.ver.outputs.version }}"; V="${V#v}"
          tar -czf "securetrans-${V}.tar.gz" \
            --exclude='.git' --exclude='venv' --exclude='.venv' \
            --exclude='packages/*.tar.gz' --exclude='*.pyc' --exclude='__pycache__' \
            src tests infra docs env offline-python README.md AGENTS.md LICENSE .github
          md5sum "securetrans-${V}.tar.gz" > "securetrans-${V}.tar.gz.md5"
          sha256sum "securetrans-${V}.tar.gz" > "securetrans-${V}.tar.gz.sha256"
          ls -lh "securetrans-${V}.tar.gz"*

      - name: Build image + save offline tar.gz + push GHCR（第 5 资产，ADR-058）
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"; VN="${V#v}"
          # GHCR 与 GitHub 账号天然打通：Actions 内 GITHUB_TOKEN 自带 packages:write，零注册
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # registry 仓库名必须全小写（Docker tag 约束）：GITHUB_REPOSITORY 大写会报 repository name must be lowercase
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -f infra/docker/Dockerfile.run -t "${IMG}:${VN}" .
          docker tag "${IMG}:${VN}" "${IMG}:latest"
          # 离线兜底资产：docker save → gzip（生产零出网，podman load 直接用）
          docker save "${IMG}:${VN}" | gzip -9 > "securetrans-${VN}-image.tar.gz"
          md5sum "securetrans-${VN}-image.tar.gz" > "securetrans-${VN}-image.tar.gz.md5"
          sha256sum "securetrans-${VN}-image.tar.gz" > "securetrans-${VN}-image.tar.gz.sha256"
          ls -lh "securetrans-${VN}-image.tar.gz"*
          docker push "${IMG}:${VN}"
          docker push "${IMG}:latest"
          echo "GHCR push OK: ${IMG}:${VN} (+latest)"

      - name: Create/Update GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          VN="${V#v}"
          FILES=("securetrans-${VN}.tar.gz" "securetrans-${VN}.tar.gz.md5" "securetrans-${VN}.tar.gz.sha256" "packages/securetrans-offline-deps.tar.gz" "securetrans-${VN}-image.tar.gz" "securetrans-${VN}-image.tar.gz.md5" "securetrans-${VN}-image.tar.gz.sha256")
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V 已存在，补齐/覆盖资产"
            gh release upload "$V" "${FILES[@]}" --clobber
          else
            echo "创建 Release $V"
            gh release create "$V" "${FILES[@]}" \
              --title "$V" \
              --notes "SecureTrans 独立发布（GitHub 云构建）
              - CI: push 全量 TDD（preflight + 静态 + TDD）
              - Release: 5 类资产（主包 + md5 + sha256 + offline-deps + image.tar.gz 及校验）
              - 镜像双通道: GHCR（在线） + image.tar.gz（离线兜底，podman load）
              - CD-SIM: ubuntu 云端 Docker 仿真验证（release published 自动触发）"
          fi
          echo "RELEASE $V: DONE"

      - name: Trigger CD-SIM (explicit dispatch, bypass GITHUB_TOKEN release-event limit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 保护机制：用 GITHUB_TOKEN 创建的 Release 不会触发 release 事件（防递归）。
          # 故在 RELEASE 成功后显式触发 CD-SIM（workflow_dispatch + 版本参数），实现"Release 完成 → CD 仿真"的自动顺序。
          V="${{ steps.ver.outputs.version }}"
          gh workflow run cd-sim.yml --ref main -f "version=$V"
          echo "CD-SIM 已触发（version=$V）"
