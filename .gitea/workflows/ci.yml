name: CI-TDD

# SecureTrans 持续集成（ADR-016 12-Factor 三环境一体化 · ADR-018 CI 分层与质量门禁 · ADR-019 容器隔离 · ADR-020 单容器归一化）
# 触发：push 到 main 或 push tag v*，在 WSL rocky10-st 的 act_runner 执行
# 运行模式（ADR-019/020，与 Docker Desktop/Gitea 完全独立）：
#   - securetrans-ci = 唯一容器 label（docker://securetrans-ci:3.12，WSL 内独立 docker daemon）
#     → ci-check / package 全部容器 job：每次全新容器 + 新配置 + 新数据，零宿主污染
# 归一化原则（ADR-020，双 label 收敛为单 label）：
#   - 需要发布/传递的制品 → 放 Gitea Release（容器内构建 + Gitea API 上传，token 可选）
#   - 构建工具链（wheelhouse）保留在镜像内 → package job 容器内自包含，不再依赖宿主共享目录
#   - 一次性验证 → 测试完成后保留 CI 脚本/配置/数据/报告归档（docs/06 测试报告）
# 分层（最便宜门禁先失败；单 job 串行，规避 act_runner v0.2.11 needs bug，ADR-021）：
#   1. ci-check —— 静态门禁（语法/静态检查/版本一致性/配置模板/脚本完整性/配置键一致，秒级先失败）
#                  + 全量 TDD（容器内 ci_test.sh，317 项基线；ADR-017 测试/生产隔离）
#   2. package     —— 仅 tag v* 触发：容器内生成 offline-deps（镜像 wheelhouse）→ package.sh 构建发布包
#                     → 产物完整性校验（md5/sha256/解压结构）→ Gitea Release 上传（RELEASETOKEN secret，无则跳过）
# 前置：
#   1. Gitea 启用 Actions（站点配置 → Actions → 启用）
#   2. act_runner systemd 常驻（infra/act_runner.service.example），label：securetrans-ci:docker://securetrans-ci:3.12
#   3. WSL 内独立 docker daemon（dnf install docker-ce，与 Docker Desktop 无关）
#   4. 镜像构建：docker build -f infra/docker/Dockerfile -t securetrans-ci:3.12 infra/docker（wheelhouse 由 offline-deps 解压）
#   5. 自动发布：Gitea 用户设置→应用→生成 API 令牌 → 仓库 Settings→Actions→Secrets 添加 RELEASETOKEN
# 说明：CI 容器=开发/测试环境一致（Python 3.12 + 离线 wheelhouse + 系统工具）；生产不做写数据自动化（ADR-017 冒烟 + 人工验收）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # ============================================================
  # 1. 秒级静态门禁 + 全量 TDD（单 job 串行，ADR-021）
  #    act_runner v0.2.11 对 needs 依赖解析有 bug（"runs-on not defined"/"No steps found"→假绿），
  #    故合并 fast-check + tdd-verify 为单 job：先静态门禁（秒级先失败），再全量 TDD（ci_test.sh）。
  # ============================================================
  ci-check:
    runs-on: securetrans-ci
    steps:
      - name: Clone 代码（经 WSL 网关访问 Gitea）+ Python 静态检查
        run: |
          set -euo pipefail
          hex_ip() { local h=$1; echo "$((16#${h:6:2})).$((16#${h:4:2})).$((16#${h:2:2})).$((16#${h:0:2}))"; }
          CI_GW="${CI_GATEWAY:-$(hex_ip "$(awk '$2=="00000000" {print $3; exit}' /proc/net/route 2>/dev/null)")}"
          CI_GITEA_URL="${CI_GITEA_URL:-http://${CI_GW}:3000}"
          WS="${GITHUB_WORKSPACE:-/workspace}"
          cd "$WS"
          if [ ! -f src/app.py ]; then
            rm -rf "$WS" && mkdir -p "$WS"
            git clone --depth 1 "${CI_GITEA_URL}/openwrtadmin/SecureTrans.git" "$WS"
            cd "$WS"
          fi
          python -m py_compile src/app.py tests/test_api.py infra/static_check.py
          python infra/static_check.py src/app.py tests/test_api.py
          echo "静态检查: PASS"

      - name: 版本号双源一致性（app.py ↔ index.html）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          V_BE=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
          V_FE=$(grep -m1 "const APP_VERSION = 'v" src/static/index.html | sed -E "s/.*'v([^']+)'.*/\1/")
          echo "  backend: ${V_BE} | frontend: ${V_FE}"
          [ "$V_BE" = "$V_FE" ] || { echo "版本不一致: FAIL"; exit 1; }
          echo "版本一致性: PASS"

      - name: env 模板 ENV_ROLE 正确性
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          grep -q '^ENV_ROLE=test' env/dev.env || { echo "env/dev.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=test' env/test.env || { echo "env/test.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=prod' env/prod.env.template || { echo "env/prod.env.template 缺少 ENV_ROLE=prod"; exit 1; }
          echo "env 模板 ENV_ROLE: PASS"

      - name: 关键脚本完整性（deploy/verify/smoke/package/release/ci_test）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          for f in infra/deploy.sh infra/verify.sh infra/smoke.sh infra/package.sh infra/release.ps1 infra/ci_test.sh; do
            [ -f "$f" ] || { echo "缺少 $f"; exit 1; }
          done
          echo "脚本完整性: PASS"

      - name: 配置键一致性（ADR-020：三环境 env 键集合对齐，防配置漂移）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          python - <<'EOF'
          import re
          def keys(p):
              return {m.group(1) for m in re.finditer(r'^\s*([A-Z][A-Z0-9_]*)=', open(p, encoding='utf-8').read(), re.M)}
          dev, test, prod = keys('env/dev.env'), keys('env/test.env'), keys('env/prod.env.template')
          core = dev & test                    # dev 与 test 必须完全一致
          drift = dev ^ test
          missing_in_prod = core - prod        # prod 可多（生产增强键），不可缺核心键
          errs = []
          if drift: errs.append(f"dev/test 键不一致: {sorted(drift)}")
          if missing_in_prod: errs.append(f"prod 缺少核心键: {sorted(missing_in_prod)}")
          if errs:
              for e in errs: print("FAIL:", e)
              exit(1)
          print(f"配置键一致性: PASS (dev={len(dev)} test={len(test)} prod={len(prod)})")
          EOF

      - name: Clone + 容器内全量 TDD（ci_test.sh：新配置 + 新数据 + 零宿主污染）
        run: |
          set -euo pipefail
          hex_ip() { local h=$1; echo "$((16#${h:6:2})).$((16#${h:4:2})).$((16#${h:2:2})).$((16#${h:0:2}))"; }
          CI_GW="${CI_GATEWAY:-$(hex_ip "$(awk '$2=="00000000" {print $3; exit}' /proc/net/route 2>/dev/null)")}"
          CI_GITEA_URL="${CI_GITEA_URL:-http://${CI_GW}:3000}"
          WS="${GITHUB_WORKSPACE:-/workspace}"
          cd "$WS"
          if [ ! -f src/app.py ]; then
            rm -rf "$WS" && mkdir -p "$WS"
            git clone --depth 1 "${CI_GITEA_URL}/openwrtadmin/SecureTrans.git" "$WS"
            cd "$WS"
          fi
          bash infra/ci_test.sh

  # ============================================================
  # 2. 发布构建（容器，仅 tag v* 触发，ADR-020 单容器归一化；无 needs，规避 act_runner v0.2.11 needs bug）：
  #    镜像 wheelhouse 生成 offline-deps → package.sh → 产物校验 → Gitea Release 上传（token 可选）
  # ============================================================
  package:
    runs-on: securetrans-wsl
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Clone（经 WSL 网关访问 Gitea）
        run: |
          set -euo pipefail
          hex_ip() { local h=$1; echo "$((16#${h:6:2})).$((16#${h:4:2})).$((16#${h:2:2})).$((16#${h:0:2}))"; }
          CI_GW="${CI_GATEWAY:-$(hex_ip "$(awk '$2=="00000000" {print $3; exit}' /proc/net/route 2>/dev/null)")}"
          CI_GITEA_URL="${CI_GITEA_URL:-http://${CI_GW}:3000}"
          echo "CI_GITEA_URL=${CI_GITEA_URL}" >> "$GITHUB_ENV"
          WS="${GITHUB_WORKSPACE:-/workspace}"
          rm -rf "$WS" && mkdir -p "$WS"
          git clone --depth 1 "${CI_GITEA_URL}/openwrtadmin/SecureTrans.git" "$WS"
          cd "$WS"

      - name: 生成 offline-deps（镜像 wheelhouse 自包含；旧镜像 fallback Gitea Release）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          mkdir -p packages
          if [ -d /wheelhouse ] && ls /wheelhouse/*.whl >/dev/null 2>&1; then
            tar -czf packages/securetrans-offline-deps.tar.gz -C / wheelhouse
            echo "offline-deps 来自镜像 wheelhouse（自包含构建工具链）"
          else
            V=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
            curl -sL -o packages/securetrans-offline-deps.tar.gz \
              "${CI_GITEA_URL}/openwrtadmin/SecureTrans/releases/download/v${V}/securetrans-offline-deps.tar.gz" || true
            [ -s packages/securetrans-offline-deps.tar.gz ] || { echo "offline-deps 不可用（镜像无 wheelhouse 且 Release 无资产）"; exit 1; }
            echo "offline-deps 来自 Gitea Release v${V}"
          fi
          ls -la packages/securetrans-offline-deps.tar.gz

      - name: Build release package (package.sh)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          bash infra/package.sh
          ls -la packages/securetrans-*.tar.gz*

      - name: 产物完整性校验（md5 / sha256 / 解压结构）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}/packages"
          PKG=$(ls securetrans-*.tar.gz | head -1)
          V=$(basename "$PKG" | sed 's/securetrans-//;s/.tar.gz//')
          md5sum -c "securetrans-${V}.tar.gz.md5"
          sha256sum -c "securetrans-${V}.tar.gz.sha256"
          echo "--- 发布包结构（前 12 项）---"
          tar -tzf "$PKG" | head -12
          [ -f "securetrans-${V}.tar.gz" ] || { echo "发布包缺失"; exit 1; }
          echo "package 完整性: PASS (v${V})"

      - name: 上传 Gitea Release（RELEASETOKEN secret；无 token 跳过上传，构建校验照常）
        env:
          RELEASETOKEN: ${{ secrets.RELEASETOKEN }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          if [ -z "${RELEASETOKEN:-}" ]; then
            echo "无 RELEASETOKEN，跳过 Release 上传（package 构建与校验已通过；发布可走 infra/release.ps1）"
            exit 0
          fi
          PKG=$(ls packages/securetrans-*.tar.gz | head -1)
          V=$(basename "$PKG" | sed 's/securetrans-//;s/.tar.gz//')
          API="${CI_GITEA_URL}/api/v1/repos/openwrtadmin/SecureTrans"
          RID=$(curl -s -H "Authorization: token ${RELEASETOKEN}" "${API}/releases?limit=50" \
            | python3 -c "import sys,json; rs=json.load(sys.stdin); print(next((str(r['id']) for r in rs if r.get('tag_name')=='v${V}'), ''))" 2>/dev/null || true)
          if [ -z "$RID" ]; then
            RID=$(curl -s -X POST -H "Authorization: token ${RELEASETOKEN}" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"v${V}\",\"name\":\"v${V}\",\"body\":\"SecureTrans v${V}（CI 容器构建自动发布）\",\"draft\":false,\"prerelease\":false}" \
              "${API}/releases" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          [ -n "$RID" ] || { echo "Release 创建失败"; exit 1; }
          for f in "${PKG}" "packages/securetrans-${V}.tar.gz.md5" "packages/securetrans-${V}.tar.gz.sha256" packages/securetrans-offline-deps.tar.gz; do
            curl -s -X POST -H "Authorization: token ${RELEASETOKEN}" -F "attachment=@${f}" "${API}/releases/${RID}/assets" >/dev/null || true
          done
          echo "Release v${V} 资产上传完成（${PKG} + md5 + sha256 + offline-deps）"
