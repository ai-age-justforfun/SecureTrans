name: CI-TDD

# SecureTrans 持续集成（ADR-016 12-Factor 三环境一体化 · ADR-018 CI 分层与质量门禁 · ADR-019 容器隔离 · ADR-020 单容器归一化）
# 触发：push 到 main 或 push tag v*，在 WSL rocky10-st 的 act_runner 执行
# 运行模式（ADR-019/020，与 Docker Desktop/Gitea 完全独立）：
#   - securetrans-ci = 唯一容器 label（docker://securetrans-ci:3.12，WSL 内独立 docker daemon）
#     → ci-check 全部容器 job：每次全新容器 + 新配置 + 新数据，零宿主污染
# 分层（最便宜门禁先失败；单 job 串行，规避 act_runner v0.2.11 needs bug，ADR-021）：
#   1. ci-check —— 静态门禁（语法/静态检查/版本一致性/配置模板/脚本完整性/配置键一致，秒级先失败）
#                  + 全量 TDD（容器内 ci_test.sh，ADR-017 测试/生产隔离）
#   ⚠️ v2.6.7（ADR-037）发布构建已拆分为独立 workflow：.gitea/workflows/release.yml（job 名 release，
#      对齐 GitHub release.yml 命名）；本文件只保留 CI 职责。顺序：CI（push/tag）→ Release（tag）→ CD（release published）。
# 前置：
#   1. Gitea 启用 Actions（站点配置 → Actions → 启用）
#   2. act_runner systemd 常驻（infra/act_runner.service.example），label：securetrans-ci:docker://securetrans-ci:3.12
#   3. WSL 内独立 docker daemon（dnf install docker-ce，与 Docker Desktop 无关）
#   4. 镜像构建：docker build -f infra/docker/Dockerfile -t securetrans-ci:3.12 infra/docker（wheelhouse 由 offline-deps 解压）
# 说明：CI 容器=开发/测试环境一致（Python 3.12 + 离线 wheelhouse + 系统工具）；生产不做写数据自动化（ADR-017 冒烟 + 人工验收）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # ============================================================
  # 1. 秒级静态门禁 + 全量 TDD（单 job 串行，ADR-021）
  #    act_runner v0.2.11 对 needs 依赖解析有 bug（"runs-on not defined"/"No steps found"→假绿），
  #    故合并 fast-check + tdd-verify 为单 job：先静态门禁（秒级先失败），再全量 TDD（ci_test.sh）。
  # ============================================================
  ci-check:
    runs-on: securetrans-ci
    steps:
      - name: Clone 代码（经 WSL 网关访问 Gitea）+ Python 静态检查
        run: |
          set -euo pipefail
          CI_GW="${CI_GATEWAY:-172.17.0.1}"
          CI_GITEA_URL="${CI_GITEA_URL:-http://${CI_GW}:3000}"
          WS="${GITHUB_WORKSPACE:-/workspace}"
          cd "$WS"
          if [ ! -f src/app.py ]; then
            rm -rf "$WS"/* "$WS"/.[!.]* 2>/dev/null || true
            git clone --depth 1 "${CI_GITEA_URL}/openwrtadmin/SecureTrans.git" "$WS"
            cd "$WS"
          fi
          # ADR-035 preflight：环境前置检查（依赖/版本双源/端口/残留清理），FAIL 即阻断
          PORT=18000 CLEAN_DIR=/data bash infra/preflight.sh
          python -m py_compile src/app.py tests/test_api.py infra/static_check.py
          python infra/static_check.py src/app.py tests/test_api.py
          echo "静态检查: PASS"

      - name: 版本号双源一致性（app.py ↔ index.html）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          V_BE=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
          V_FE=$(grep -m1 "const APP_VERSION = 'v" src/static/index.html | sed -E "s/.*'v([^']+)'.*/\1/")
          echo "  backend: ${V_BE} | frontend: ${V_FE}"
          [ "$V_BE" = "$V_FE" ] || { echo "版本不一致: FAIL"; exit 1; }
          echo "版本一致性: PASS"

      - name: env 模板 ENV_ROLE 正确性
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          grep -q '^ENV_ROLE=test' env/dev.env || { echo "env/dev.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=test' env/test.env || { echo "env/test.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=prod' env/prod.env.template || { echo "env/prod.env.template 缺少 ENV_ROLE=prod"; exit 1; }
          echo "env 模板 ENV_ROLE: PASS"

      - name: 关键脚本完整性（deploy/verify/smoke/package/release/ci_test）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          for f in infra/deploy.sh infra/verify.sh infra/smoke.sh infra/package.sh infra/release.ps1 infra/ci_test.sh; do
            [ -f "$f" ] || { echo "缺少 $f"; exit 1; }
          done
          echo "脚本完整性: PASS"

      - name: 配置键一致性（ADR-020：三环境 env 键集合对齐，防配置漂移）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          python - <<'EOF'
          import re
          def keys(p):
              return {m.group(1) for m in re.finditer(r'^\s*([A-Z][A-Z0-9_]*)=', open(p, encoding='utf-8').read(), re.M)}
          dev, test, prod = keys('env/dev.env'), keys('env/test.env'), keys('env/prod.env.template')
          core = dev & test                    # dev 与 test 必须完全一致
          drift = dev ^ test
          missing_in_prod = core - prod        # prod 可多（生产增强键），不可缺核心键
          errs = []
          if drift: errs.append(f"dev/test 键不一致: {sorted(drift)}")
          if missing_in_prod: errs.append(f"prod 缺少核心键: {sorted(missing_in_prod)}")
          if errs:
              for e in errs: print("FAIL:", e)
              exit(1)
          print(f"配置键一致性: PASS (dev={len(dev)} test={len(test)} prod={len(prod)})")
          EOF

      - name: Clone + 容器内全量 TDD（ci_test.sh：新配置 + 新数据 + 零宿主污染）
        run: |
          set -euo pipefail
          CI_GW="${CI_GATEWAY:-172.17.0.1}"
          CI_GITEA_URL="${CI_GITEA_URL:-http://${CI_GW}:3000}"
          WS="${GITHUB_WORKSPACE:-/workspace}"
          cd "$WS"
          if [ ! -f src/app.py ]; then
            rm -rf "$WS"/* "$WS"/.[!.]* 2>/dev/null || true
            git clone --depth 1 "${CI_GITEA_URL}/openwrtadmin/SecureTrans.git" "$WS"
            cd "$WS"
          fi
          bash infra/ci_test.sh
