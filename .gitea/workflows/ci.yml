name: CI-TDD

# SecureTrans 持续集成（ADR-016 12-Factor 三环境一体化 · ADR-018 CI 分层与质量门禁 · ADR-019 容器隔离）
# 触发：push 到 main 或 push tag v*，在 WSL rocky10-st 的 act_runner 执行
# 运行模式（ADR-019，与 Docker Desktop/Gitea 完全独立）：
#   - securetrans-ci   = 容器 label（docker://securetrans-ci:3.12，WSL 内独立 docker daemon）
#     → fast-check / tdd-verify：每次 job 全新容器 + 新配置 + 新数据，零宿主污染
#   - securetrans-wsl  = 宿主 label（保留）→ package：需访问共享制品目录 /opt/securetrans/packages
# 分层（最便宜门禁先失败）：
#   1. fast-check  —— 秒级静态门禁（语法/静态检查/版本一致性/配置模板/脚本完整性），总跑
#   2. tdd-verify  —— 全量 TDD 回归（容器内 ci_test.sh，309 项基线；ADR-017 测试/生产隔离）
#   3. package     —— 仅 tag v* 触发：复用 offline-deps 构建发布包并落到共享 packages/
#                     实际 Release 资产由 infra/release.ps1 手工发布（发布策略 ADR-014）
# 前置：
#   1. Gitea 启用 Actions（站点配置 → Actions → 启用）
#   2. act_runner systemd 常驻（infra/act_runner.service.example），双 label：securetrans-wsl:host + securetrans-ci:docker://securetrans-ci:3.12
#   3. WSL 内独立 docker daemon（dnf install docker-ce，与 Docker Desktop 无关）
#   4. 镜像构建：docker build -f infra/docker/Dockerfile -t securetrans-ci:3.12 infra/docker（wheelhouse 由 offline-deps 解压）
# 说明：CI 容器=开发/测试环境一致（Python 3.12 + 离线 wheelhouse + 系统工具）；生产不做写数据自动化（ADR-017 冒烟 + 人工验收）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # ============================================================
  # 1. 秒级静态门禁（容器，总是执行，最便宜先失败）
  # ============================================================
  fast-check:
    runs-on: securetrans-ci
    steps:
      - name: Clone 代码（host 网络显式 checkout）+ Python 静态检查
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-/workspace}"
          cd "$WS"
          if [ ! -f src/app.py ]; then
            rm -rf "$WS" && mkdir -p "$WS"
            git clone --depth 1 http://localhost:3000/openwrtadmin/SecureTrans.git "$WS"
            cd "$WS"
          fi
          python -m py_compile src/app.py tests/test_api.py infra/static_check.py
          python infra/static_check.py src/app.py tests/test_api.py
          echo "静态检查: PASS"

      - name: 版本号双源一致性（app.py ↔ index.html）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          V_BE=$(grep -m1 '^APP_VERSION = "v' src/app.py | sed -E 's/.*"v([^"]+)".*/\1/')
          V_FE=$(grep -m1 "const APP_VERSION = 'v" src/static/index.html | sed -E "s/.*'v([^']+)'.*/\1/")
          echo "  backend: ${V_BE} | frontend: ${V_FE}"
          [ "$V_BE" = "$V_FE" ] || { echo "版本不一致: FAIL"; exit 1; }
          echo "版本一致性: PASS"

      - name: env 模板 ENV_ROLE 正确性
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          grep -q '^ENV_ROLE=test' env/dev.env || { echo "env/dev.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=test' env/test.env || { echo "env/test.env 缺少 ENV_ROLE=test"; exit 1; }
          grep -q '^ENV_ROLE=prod' env/prod.env.template || { echo "env/prod.env.template 缺少 ENV_ROLE=prod"; exit 1; }
          echo "env 模板 ENV_ROLE: PASS"

      - name: 关键脚本完整性（deploy/verify/smoke/package/release/ci_test）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          for f in infra/deploy.sh infra/verify.sh infra/smoke.sh infra/package.sh infra/release.ps1 infra/ci_test.sh; do
            [ -f "$f" ] || { echo "缺少 $f"; exit 1; }
          done
          echo "脚本完整性: PASS"

  # ============================================================
  # 2. 全量 TDD 回归（容器，每次全新环境；依赖 fast-check 通过）
  # ============================================================
  tdd-verify:
    runs-on: securetrans-ci
    needs: fast-check
    steps:
      - name: 容器内全量 TDD（ci_test.sh：新配置 + 新数据 + 零宿主污染）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-/workspace}"
          bash infra/ci_test.sh

  # ============================================================
  # 3. 发布构建（宿主，仅 tag v* 触发）：复用 offline-deps → 构建发布包 → 共享制品目录
  #    实际 Release 资产由 infra/release.ps1 手工上传（同一制品，可追溯）
  # ============================================================
  package:
    runs-on: securetrans-wsl
    needs: [ fast-check, tdd-verify ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Clone tagged code
        run: |
          set -euo pipefail
          sudo rm -rf /opt/securetrans-ci
          sudo git clone --depth 1 --branch "${{ github.ref_name }}" \
            "http://localhost:3000/openwrtadmin/SecureTrans.git" /opt/securetrans-ci
          sudo chmod -R a+rX /opt/securetrans-ci

      - name: Prepare offline-deps (reuse pre-built wheel bundle)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/securetrans-ci/packages
          sudo cp /opt/securetrans/packages/securetrans-offline-deps.tar.gz /opt/securetrans-ci/packages/ 2>/dev/null \
            || echo "WARN: offline-deps 未找到，包将不含离线 wheel（联网环境可 pip download 生成）"

      - name: Build release package (package.sh)
        run: |
          set -euo pipefail
          cd /opt/securetrans-ci && sudo bash infra/package.sh
          ls -la /opt/securetrans-ci/packages/securetrans-*.tar.gz*

      - name: Publish artifacts to shared packages dir (for release.ps1)
        run: |
          set -euo pipefail
          # 离线环境无 node/网络，不使用 actions/upload-artifact@v4；
          # 构建制品落到 WSL 共享 packages/（build once, deploy many），
          # 发布时：wsl cp packages/securetrans-<v>.tar.gz* <win>/packages/ && infra/release.ps1 -Version v<v>
          sudo cp /opt/securetrans-ci/packages/securetrans-*.tar.gz* /opt/securetrans/packages/
          echo "--- 共享 packages/ 制品 ---"
          ls -la /opt/securetrans/packages/ | tail -6
